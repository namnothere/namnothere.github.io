<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Table Viewer</title>
    <style>
        :root {
            --bg: #f8fafc;
            --fg: #0f172a;
            --muted: #64748b;
            --border: #e2e8f0;
            --accent: #3b82f6;
            --row-alt: #f1f5f9;
        }

        html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji"; line-height: 1.5; }

        .container { max-width: 1200px; margin: 24px auto; padding: 0 16px; }
        h1 { font-size: 22px; margin: 0 0 16px; }
        .hint { color: var(--muted); font-size: 13px; margin-bottom: 16px; }

        .toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
        input[type="search"] { padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; width: 280px; font-size: 14px; background: #fff; }
        .count { font-size: 13px; color: var(--muted); margin-left: auto; }

        .table-wrap { background: #fff; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,0.04); }
        .table-scroll { width: 100%; overflow: auto; }
        table { border-collapse: collapse; width: 100%; min-width: 800px; }
        thead th { position: sticky; top: 0; background: #fff; z-index: 1; }
        th, td { border-bottom: 1px solid var(--border); padding: 10px 12px; text-align: left; vertical-align: top; font-size: 14px; }
        tbody tr:nth-child(odd) { background: var(--row-alt); }
        th { font-weight: 600; white-space: nowrap; }
        a.link { color: var(--accent); text-decoration: none; word-break: break-all; }
        a.link:hover { text-decoration: underline; }

        .img-cell img { display: block; width: 120px; height: 90px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border); background: #fff; }
        .img-cell { min-width: 140px; }

        .error { color: #b91c1c; font-size: 14px; margin: 8px 0 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Table from table.html</h1>
        <div class="hint">Loads markup from <code>table.html</code>. Use a local server if opening from file://</div>

        <div class="toolbar">
            <input id="search" type="search" placeholder="Filter rows (case-insensitive)" />
            <div id="count" class="count"></div>
        </div>

        <div class="table-wrap">
            <div class="table-scroll"><div id="table-slot"></div></div>
        </div>
        <div id="error" class="error" role="alert" style="display:none"></div>
    </div>

    <script>
        const TABLE_HTML_PATH = 'table.html';

        function showError(msg) {
            const el = document.getElementById('error');
            el.textContent = msg;
            el.style.display = 'block';
        }

        function updateCountFromTable(table) {
            const tbody = table.querySelector('tbody');
            const visible = Array.from(tbody?.rows || []).filter(r => r.style.display !== 'none');
            document.getElementById('count').textContent = `${visible.length} rows`;
        }

        function attachFiltering(table) {
            const input = document.getElementById('search');
            const tbody = table.querySelector('tbody');
            const rows = Array.from(tbody?.rows || []);
            input.addEventListener('input', () => {
                const q = input.value.trim().toLowerCase();
                rows.forEach(r => {
                    const txt = r.textContent?.toLowerCase() || '';
                    r.style.display = q && !txt.includes(q) ? 'none' : '';
                });
                updateCountFromTable(table);
                observeImages(table); // re-check visibility after filtering
            });
        }

        function observeImages(root) {
            const images = root.querySelectorAll('td.img-cell img');
            images.forEach(img => {
                if (img.dataset.observed) return;
                img.dataset.observed = '1';
                // Convert eager src to data-src for lazy load if needed
                if (!img.dataset.src && img.src) {
                    img.dataset.src = img.src;
                    img.removeAttribute('src');
                }
            });

            const io = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const el = entry.target;
                        const ds = el.getAttribute('data-src');
                        if (ds && !el.getAttribute('src')) {
                            el.setAttribute('src', ds);
                        }
                        io.unobserve(el);
                    }
                });
            }, { root: document.querySelector('.table-scroll'), rootMargin: '200px', threshold: 0.01 });

            images.forEach(img => io.observe(img));
        }

        async function loadTableHTML() {
            try {
                const res = await fetch(TABLE_HTML_PATH);
                const html = await res.text();
                const slot = document.getElementById('table-slot');
                slot.innerHTML = html;

                const table = slot.querySelector('table');
                if (!table) { showError('table.html did not contain a <table>.'); return; }
                attachFiltering(table);
                updateCountFromTable(table);
                observeImages(table);
            } catch (e) {
                console.error(e);
                showError('Failed to load table.html. If opening this file directly, run a local server (e.g., "python -m http.server").');
            }
        }

        loadTableHTML();
    </script>
</body>
</html>
